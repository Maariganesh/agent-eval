[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval"
version = "0.1.0"
description = "Harness evaluation tool for coding agents: evidence-based trust for AGENTS.md, skills, and prompts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.0.0",
]

[project.optional-dependencies]
live = [
    "litellm>=1.0.0",
    "openai>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
agent-eval = "harness_eval.cli:main"
